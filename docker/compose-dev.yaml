services:
  front:
    build:
      target: dev
    volumes:
      - ../frontend/:/app:z
      - frontend-node-modules:/app/node_modules
      - frontend-next-cache:/app/.next
    networks:
      - transcendence-net
    command: bun run dev
  
  api:
    build:
      target: dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
      CHOKIDAR_USEPOLLING: "true" # To avoid hot reload problem
    volumes:
      - ../backend/api:/api:z
      - api-node-modules:/api/node_modules
    depends_on:
      db:
        condition: service_healthy
    networks:
      - transcendence-net
    command: sh -c "bunx prisma generate && bunx prisma migrate deploy && bun run start:dev"

  db:
    ports:
      - "5433:5432"
    networks:
      - transcendence-net

  adminer:
    image: adminer:4.8.1
    container_name: transcendence_adminer
    env_file: .env
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8081:8080"
    networks:
      - transcendence-net

  proxy:
    networks:
      - transcendence-net

networks:
  transcendence-net:
    name: transcendence-net
    driver: bridge

volumes:
  frontend-node-modules:
    name: transcendence-frontend-node-modules
  frontend-next-cache:
    name: transcendence-frontend-next-cache
  api-node-modules:
    name: transcendence-api-node-modules
