services:
  front:
    image: transcendence_front
    container_name: transcendence_front
    pull_policy: build
    build:
      context: ../frontend/
      target: prod
    restart: always
    env_file: .env
    environment:
      NEXT_INTERNAL_API_URL: ${NEXT_INTERNAL_API_URL}
      NODE_EXTRA_CA_CERTS: ${CADDY_INTERNAL_CA_CERT}
    depends_on:
      proxy:
        condition: service_healthy
    volumes:
      - caddy-data:/caddy-data:ro
  
  api:
    image: transcendence_api
    container_name: transcendence_api
    pull_policy: build
    build:
      context: ../backend/api/
      target: prod
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public
    depends_on:
      - db
      
  db:
    image: transcendence_db
    container_name: transcendence_db
    pull_policy: build
    build: ../backend/db/
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - db-data:/var/lib/postgresql

  proxy:
    image: caddy:2.11-alpine
    container_name: transcendence_proxy
    restart: always
    ports:
      # - "4280:80"
      - "2323:2323"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/caddy/pki/authorities/local/root.crt"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 2s


volumes:
  db-data:
    name: transcendence-db-data
  caddy-data:
    name: transcendence-caddy-data
  caddy-config:
    name: transcendence-caddy-config
